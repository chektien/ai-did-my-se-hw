version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rcps
      POSTGRES_PASSWORD: rcps
      POSTGRES_DB: rcps
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./apps/backend
    environment:
      DATABASE_URL: postgresql://rcps:rcps@db:5432/rcps
      JWT_SECRET: change-me
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - db
  frontend:
    build:
      context: ./apps/frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5174:5173"
    depends_on:
      - backend
volumes:
  db_data:
